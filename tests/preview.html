<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>実績 UI プレビュー（モック）</title>
<style>
body{margin:0;display:grid;place-content:center;gap:12px;min-height:100vh;background:#d8dcd3;font:14px sans-serif}
iframe{width:390px;height:844px;border:8px solid #252923;border-radius:40px;background:#f8f7f3}
nav{display:flex;flex-wrap:wrap;max-width:406px;justify-content:center;gap:12px}button{padding:8px 16px}
</style>
<nav><button id="theme">テーマ切替</button><button id="fail">次の通信を失敗</button><button id="empty">空の一覧</button><button id="statistics">取得率の状態</button></nav>
<iframe src="../ui/index.html" title="実績"></iframe>
<script>
const frame = document.querySelector('iframe');
const entries = [
 {id:'welcome',name:'はじめの一歩',description:'この街で、新しい生活を始める。',title:'新しい住民',target:1,unit:'回',progress:1,unlocked:true,unlockedAt:1793185200,unlockedCount:87},
 {id:'one_hour',name:'街に馴染んで',description:'この街で合計1時間を過ごす。',title:'街の住民',target:60,unit:'分',progress:24,unlocked:false,unlockedCount:25},
 {id:'ten_hours',name:'いつもの街角',description:'この街で合計10時間を過ごす。',title:'街の常連',target:600,unit:'分',progress:24,unlocked:false,unlockedCount:3}
];
let selected=false, fail=false, empty=false, dark=false, statisticsMode=0;
const statisticsUpdatedAt=Math.floor(Date.now()/1000);
frame.onload=()=>{
 const ui=frame.contentWindow;
 ui.fetchNui=async(event,data)=>{
   if(fail){fail=false;return {ok:false,error:'テスト用の通信エラーです。更新して再試行してください。'};}
   if(event==='selectTitle'){
     if(data.id && !entries.some(e=>e.id===data.id&&e.unlocked)) return {ok:false,error:'未獲得です。'};
     selected=data.id||false;
   }
   return {ok:true,achievements:empty?[]:entries.map(entry=>({...entry,unlockedCount:statisticsMode===2?0:entry.unlockedCount})),selected,statistics:statisticsMode===1?undefined:{totalPlayers:statisticsMode===2?0:200,updatedAt:statisticsUpdatedAt,refreshMinutes:120}};
 };
};
document.querySelector('#theme').onclick=()=>{
 dark=!dark;
 frame.contentDocument.documentElement.dataset.theme=dark?'dark':'light';
};
document.querySelector('#fail').onclick=()=>{fail=true;};
document.querySelector('#statistics').onclick=()=>{
 statisticsMode=(statisticsMode+1)%3;
 frame.contentWindow.postMessage({type:'achievementsChanged'},location.origin);
};
document.querySelector('#empty').onclick=()=>{
 empty=!empty;
 frame.contentWindow.postMessage({type:'achievementsChanged'},location.origin);
};
</script>
</html>
