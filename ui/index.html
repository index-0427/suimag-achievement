<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>実績</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <header class="app-header">
            <div><span class="eyebrow">YOUR CITY, YOUR STORY</span><h1>実績</h1></div>
            <button id="refresh" class="icon-button" aria-label="実績を更新" title="更新">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg>
            </button>
        </header>
        <p id="message" role="status" aria-live="polite">実績を読み込んでいます…</p>
        <div id="content" hidden>
            <section class="summary" aria-label="達成状況">
                <div class="summary-heading"><span>この街での、あなたの歩み。</span><img src="icon.svg" alt="" class="summary-icon"></div>
                <div class="total"><strong id="unlocked-count">0</strong><span>/ <span id="total-count">0</span> 達成</span></div>
                <progress id="overall-progress" max="1" value="0" aria-label="実績の達成率"></progress>
                <p>ひとつずつ、思い出を称号に。</p>
            </section>
            <section class="equipped" aria-label="表示中の称号">
                <div><span class="eyebrow">表示中の称号</span><strong id="equipped-title">設定していません</strong></div>
                <button id="clear-title" class="text-button" hidden>外す</button>
            </section>
            <div class="section-heading"><h2>実績一覧</h2><span>達成して称号を獲得</span></div>
            <p id="statistics-info" class="statistics-info"></p>
            <div id="achievements" class="achievement-list"></div>
            <p id="empty" class="empty" hidden>実績はまだ登録されていません。</p>
            <p class="footnote">獲得した称号は、名前の横に表示できます。</p>
        </div>
    </main>
    <template id="achievement-template">
        <article class="achievement">
            <div class="achievement-heading"><span class="achievement-number"></span><span class="badge"></span></div>
            <h3></h3>
            <p class="description"></p>
            <div class="progress-label"><span class="progress-text"></span><time></time></div>
            <progress max="1" value="0"></progress>
            <p class="acquisition-rate"></p>
            <div class="reward"><span class="reward-title"></span><button class="select-button"></button></div>
        </article>
    </template>
</body>
</html>
